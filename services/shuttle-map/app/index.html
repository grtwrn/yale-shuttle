<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yale Shuttle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Disable the browser's pull-to-refresh gesture. It full-reloads the
         SPA and wipes search state (From/To, expanded option, etc.). The
         app already polls /api/buses every 5 s, so a page reload adds
         nothing the rider needed. */
      html, body { overscroll-behavior-y: contain; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
