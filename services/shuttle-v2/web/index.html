<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // A slightly wider layout at first paint makes Android phones less
      // crowded, including the installed app. Leave pinch zoom available.
      if (/Android.*Mobile/i.test(navigator.userAgent)) {
        document.documentElement.dataset.androidCompact = "true";
        document.querySelector('meta[name="viewport"]').content =
          "width=device-width, initial-scale=0.9";
      }
    </script>
    <style>
      /* Keep the main controls at least 44 screen pixels tall at 90% scale. */
      html[data-android-compact] :is(
        .trip-action-button, .trip-actions button, .trip-map-wrap button,
        #trip-from, #trip-to, input[type="datetime-local"]
      ) {
        min-height: 49px !important;
        min-width: 49px !important;
      }
    </style>
    <title>Yale Shuttle Tracker</title>
    <meta name="description" content="Unofficial live tracker for the Yale shuttles: bus positions, stop ETAs and trip planning." />
    <meta name="theme-color" content="#00356b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shuttle" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
