name: minimap-gallery-review
on:
  pull_request:
    paths:
      - 'services/shuttle-v2/web/index.html'
      - 'services/shuttle-v2/web/public/minimap-options/**'
      - 'services/shuttle-v2/scripts/minimap-gallery-check.mjs'
      - 'services/shuttle-v2/scripts/minimap-label-render.mjs'
      - 'services/shuttle-v2/scripts/__fixtures__/minimap-label-feed.json'
      - 'services/shuttle-v2/scripts/trip-scheduling-check.mjs'
      - 'services/shuttle-v2/web/src/ArrivalDetails.tsx'
      - 'services/shuttle-v2/web/src/MiniMapKey.tsx'
      - 'services/shuttle-v2/scripts/minimap-key-check.mjs'
      - 'services/shuttle-v2/scripts/orange-east-map-check.mjs'
      - 'services/shuttle-v2/scripts/grocery-search-check.mjs'
      - 'services/shuttle-v2/scripts/trip-stop-approach-check.mjs'
      - 'services/shuttle-v2/web/src/grocerySearch.ts'
      - 'services/shuttle-v2/web/src/TripServiceNotices.tsx'
      - 'services/shuttle-v2/web/src/DestinationArrival.tsx'
      - 'services/shuttle-v2/web/src/TransitMap.tsx'
      - '.github/workflows/minimap-gallery-review.yml'
concurrency:
  group: minimap-gallery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/shuttle-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/shuttle-v2/package-lock.json
      - run: npm ci && npm ci --prefix web
      - run: npm run build --prefix web
      - name: Check compact route cards at phone and desktop sizes
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" TRIP_SCHEDULING_OUT=gallery-review/cards node scripts/trip-scheduling-check.mjs
      - name: Check the smaller Android phone layout
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" TRIP_UI_ANDROID=1 TRIP_SCHEDULING_OUT=gallery-review/android node scripts/trip-scheduling-check.mjs
      - name: Inspect recorded Red hold and the timing key
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" node scripts/minimap-key-check.mjs
      - name: Inspect Orange East from Division / Prospect to YSPH
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" node --import tsx scripts/orange-east-map-check.mjs
      - name: Check grocery search notices and service alerts before route selection
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" node scripts/grocery-search-check.mjs
      - name: Check the full bus approach before a loop-route pickup
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" node scripts/trip-stop-approach-check.mjs
      - name: Render current map and ten label-only variants
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" node scripts/minimap-label-render.mjs
      - name: Inspect gallery and interactions in hosted Chrome
        run: BOT_CHROMIUM_PATH="$(command -v google-chrome)" node scripts/minimap-gallery-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimap-gallery-review
          path: services/shuttle-v2/gallery-review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimap-label-previews
          path: services/shuttle-v2/web/public/minimap-options/previews/
