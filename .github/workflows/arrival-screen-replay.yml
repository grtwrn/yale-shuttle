name: arrival-screen-replay
on:
  pull_request:
    branches: [master]
    paths:
      - "services/shuttle-v2/scripts/arrival-screen-replay/**"
      - ".github/workflows/arrival-screen-replay.yml"
  workflow_dispatch:
    inputs:
      assets:
        description: Reviewed renderer asset role
        type: choice
        options: [local, production, both]
        default: local

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        assets: ${{ fromJSON((github.event_name == 'pull_request' || inputs.assets == 'both') && '["local","production"]' || format('["{0}"]', inputs.assets)) }}
    defaults:
      run:
        working-directory: services/shuttle-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            services/shuttle-v2/package-lock.json
            services/shuttle-v2/web/package-lock.json
      - name: Install backend and web dependencies
        run: npm ci && npm ci --prefix web
      # Same package-manager-free browser provisioning as the full pr-checks gate.
      - name: Provide a browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BOT_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "BOT_CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install chromium
            echo "BOT_CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
          fi
          echo "browser: $(grep BOT_CHROMIUM_PATH "$GITHUB_ENV" | tail -1)"
      - name: Build actual candidate SPA
        run: npm run build --prefix web
      - name: Finite actual-SPA replay (all browser requests intercepted)
        timeout-minutes: 4
        run: node scripts/arrival-screen-replay/replay.mjs --assets '${{ matrix.assets }}' --out 'pr-preview/arrival-screen-replay/${{ matrix.assets }}'
      - name: Upload bounded replay prefix and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrival-screen-replay-${{ matrix.assets }}-${{ github.sha }}
          path: services/shuttle-v2/pr-preview/arrival-screen-replay/${{ matrix.assets }}/
          if-no-files-found: error
          retention-days: 7
