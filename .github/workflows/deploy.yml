# Deploy from the repo, not from a working tree.
#
# Runs the SAME staged pipeline as `npm run deploy` on the Pi — typecheck,
# full test suite, frontend build, a real staging server on a throwaway DB,
# API + real-browser smoke — and only then `flyctl deploy`, followed by the
# same verification against production. scripts/deploy.mjs is the single
# source of truth for the stages; this workflow just hosts it.
#
# Trigger: any push to master that touches the app. The Pi's local
# `npm run deploy` still works as a hotfix path; day-to-day, deploying means
# pushing a commit.
name: deploy
on:
  push:
    branches: [master]
    paths:
      - "services/shuttle-v2/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: false # never kill a deploy mid-flight; queue instead

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/shuttle-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            services/shuttle-v2/package-lock.json
            services/shuttle-v2/web/package-lock.json

      - name: Install dependencies (backend + web)
        run: npm ci && npm ci --prefix web

      # Two ways of getting a browser have now failed here, both for the same
      # underlying reason — they reached for a package manager:
      #
      #   `apt-get install chromium-browser` is a snap shim on Ubuntu, and the
      #   snap store 408'd on its assertion fetch (2026-09-03).
      #   `playwright-core install --with-deps` runs `apt-get update`, and the
      #   runner image ships a Microsoft azure-cli repo that started returning
      #   403 Forbidden — "no longer signed" — which failed the DEPLOY the
      #   same day, after the PR check had passed.
      #
      # So: no package manager. The runner image already has Google Chrome;
      # drive that. Playwright's own pinned build is the fallback, and even
      # then WITHOUT --with-deps, because the runner already carries the
      # shared libraries a browser needs.
      - name: Provide a browser for the smoke test
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BOT_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "BOT_CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install chromium
            echo "BOT_CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
          fi
          echo "browser: $(grep BOT_CHROMIUM_PATH "$GITHUB_ENV" | tail -1)"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Staged deploy (gates -> staging -> smoke -> fly -> verify)
        run: npm run deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLYCTL: flyctl
