name: checkpoint-ensemble-development
on:
  push:
    branches: [research/checkpoint-ensemble-2026-09-22]
    paths: ['research/checkpoint-ensemble/**', '.github/workflows/checkpoint-ensemble.yml']
  workflow_dispatch:
    inputs:
      fixtures_only:
        description: Run only the small independent validity fixtures
        type: boolean
        default: true
      feature_run:
        description: Reuse a completed schema-2 feature run; blank regenerates causal evidence
        type: string
        default: ''
      study_run:
        description: Reuse completed frozen forecasts for report/actions only; no fitting
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s research/checkpoint-ensemble -p 'test_*.py' -v
      - run: python3 -m pip install numpy==2.2.6
      - name: Smoke-test unique study, report and action imports before heavy work
        run: |
          cd research/checkpoint-ensemble
          python3 -c 'import ensemble_study, ensemble_report, actions; assert ensemble_report.s is ensemble_study; assert actions.s is ensemble_study'
      - run: npm ci --prefix services/shuttle-v2
      - name: Run source-membership fixtures when materializer lands
        run: |
          if test -f research/checkpoint-ensemble/membership.test.ts; then
            services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-ensemble/membership.test.ts
          fi
          if test -f research/checkpoint-ensemble/progress.test.ts; then
            services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-ensemble/progress.test.ts
          fi
  materialize:
    needs: fixtures
    if: github.event_name == 'workflow_dispatch' && inputs.fixtures_only == false && inputs.feature_run == '' && inputs.study_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: America/New_York
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/shuttle-v2
      - uses: actions/download-artifact@v4
        with:
          name: k-sweep-results
          run-id: 35677536788
          github-token: ${{ github.token }}
          path: research/k-sweep/results
      - uses: actions/download-artifact@v4
        with:
          name: canonical-window-results
          run-id: 35684356219
          github-token: ${{ github.token }}
          path: research/highway-frozen
      - run: ln -s "$GITHUB_WORKSPACE/research/highway-frozen/canonical-windows/results" research/canonical-windows/results
      - name: Reproduce original controls and materialize independent causal traversals
        run: services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-ensemble/materialize.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-ensemble-features
          path: research/checkpoint-ensemble/results/**
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-ensemble-source-summary
          path: research/checkpoint-ensemble/results/materialization-audit.json
          retention-days: 90
  joint-study:
    needs: [fixtures, materialize]
    if: always() && needs.fixtures.result == 'success' && inputs.fixtures_only == false && (inputs.feature_run != '' || needs.materialize.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        policy: [highway25, highway50]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BLUE_MAX_PATH_SECONDS: '5400'
      TZ: America/New_York
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/shuttle-v2
      - run: python3 -m pip install numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-ensemble-features
          run-id: ${{ inputs.feature_run || github.run_id }}
          github-token: ${{ github.token }}
          path: research/checkpoint-ensemble/results
      - uses: actions/download-artifact@v4
        with:
          name: k-sweep-results
          run-id: 35677536788
          github-token: ${{ github.token }}
          path: research/k-sweep/results
      - uses: actions/download-artifact@v4
        with:
          name: canonical-window-results
          run-id: 35684356219
          github-token: ${{ github.token }}
          path: research/highway-frozen
      - uses: actions/download-artifact@v4
        with:
          name: canonical-route-context
          run-id: 35686813146
          github-token: ${{ github.token }}
          path: research/highway-geometry
      - uses: actions/download-artifact@v4
        with:
          name: protected-highway-window-results
          run-id: 35690386363
          github-token: ${{ github.token }}
          path: research/checkpoint-ensemble/reference
      - uses: actions/download-artifact@v4
        if: inputs.study_run != ''
        with:
          name: checkpoint-ensemble-complete-${{ matrix.policy }}
          run-id: ${{ inputs.study_run }}
          github-token: ${{ github.token }}
          path: research/checkpoint-ensemble/results/${{ matrix.policy }}
      - name: Pin original comparator and causal evidence provenance
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_RUN: ${{ inputs.feature_run || github.run_id }}
          STUDY_RUN: ${{ inputs.study_run }}
        run: |
          ln -s "$GITHUB_WORKSPACE/research/highway-frozen/canonical-windows/results" research/canonical-windows/results
          gh api repos/grtwrn/yale-shuttle/actions/artifacts/10678003242 > research/checkpoint-ensemble/reference/artifact-metadata.json
          gh api "repos/grtwrn/yale-shuttle/actions/runs/$FEATURE_RUN" > research/checkpoint-ensemble/results/feature-run-metadata.json
          gh api "repos/grtwrn/yale-shuttle/actions/runs/$FEATURE_RUN/artifacts" > research/checkpoint-ensemble/results/feature-artifact-metadata.json
          if test -n "$STUDY_RUN"; then
            gh api "repos/grtwrn/yale-shuttle/actions/runs/$STUDY_RUN" > research/checkpoint-ensemble/results/study-run-metadata.json
            gh api "repos/grtwrn/yale-shuttle/actions/runs/$STUDY_RUN/artifacts" > research/checkpoint-ensemble/results/study-artifact-metadata.json
          fi
      - name: Fit fixed arms, prove original controls and freeze unscored forecasts before joining outcomes
        if: inputs.study_run == ''
        run: python3 research/checkpoint-ensemble/ensemble_study.py --policy ${{ matrix.policy }}
      - name: Freeze exact completed forecast streams before report-only reuse
        if: inputs.study_run != ''
        run: python3 research/checkpoint-ensemble/reuse.py --policy ${{ matrix.policy }} --freeze
      - name: Render actual app windows and report all fixed route and support cells
        run: |
          services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-ensemble/printed.ts research/checkpoint-ensemble/results/${{ matrix.policy }}
          python3 research/checkpoint-ensemble/ensemble_report.py --policy ${{ matrix.policy }}
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-ensemble-pre-action-summary-${{ matrix.policy }}
          path: |
            research/checkpoint-ensemble/results/${{ matrix.policy }}/REPORT.md
            research/checkpoint-ensemble/results/${{ matrix.policy }}/summary.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/verification.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/covariance.json
            research/checkpoint-ensemble/results/materialization-audit.json
          retention-days: 90
      - name: Replay every fixed physical-visit action with exact deployed controls
        run: python3 research/checkpoint-ensemble/actions.py --policy ${{ matrix.policy }}
      - name: Prove rendering parity on both fixed action cohorts
        run: |
          services/shuttle-v2/node_modules/.bin/tsx research/useful-windows/rendered-parity.ts research/checkpoint-ensemble/results/${{ matrix.policy }}/rider-risk
          services/shuttle-v2/node_modules/.bin/tsx research/useful-windows/rendered-parity.ts research/checkpoint-ensemble/results/${{ matrix.policy }}/original-cohort/rider-risk
      - name: Prove immutable completed forecast streams survived reporting
        if: inputs.study_run != '' && always()
        run: python3 research/checkpoint-ensemble/reuse.py --policy ${{ matrix.policy }} --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-ensemble-summary-${{ matrix.policy }}
          path: |
            research/checkpoint-ensemble/PLAN.md
            research/checkpoint-ensemble/SCHEMA.md
            research/checkpoint-ensemble/results/materialization-audit.json
            research/checkpoint-ensemble/results/feature-*-metadata.json
            research/checkpoint-ensemble/results/study-*-metadata.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/REPORT.md
            research/checkpoint-ensemble/results/${{ matrix.policy }}/summary.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/verification.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/covariance.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/action-comparisons.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/reuse-audit.json
            research/checkpoint-ensemble/results/${{ matrix.policy }}/**/rendered-parity.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-ensemble-complete-${{ matrix.policy }}
          path: |
            research/checkpoint-ensemble/results/${{ matrix.policy }}/**
            !research/checkpoint-ensemble/results/**/raw_positions.jsonl.gz
          retention-days: 90
