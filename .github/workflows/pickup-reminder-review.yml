name: pickup-reminder-review
on:
  pull_request:
    branches: [master]
    paths:
      - "services/shuttle-v2/web/src/PickupReminderControls*"
      - "services/shuttle-v2/web/src/pickupReminder*"
      - "services/shuttle-v2/web/src/leaveAlert*"
      - "services/shuttle-v2/web/src/TransitMap.tsx"
      - "services/shuttle-v2/scripts/pickup-reminder-check.mjs"
      - ".github/workflows/pickup-reminder-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/shuttle-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            services/shuttle-v2/package-lock.json
            services/shuttle-v2/web/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix web
      - name: Provide a browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BOT_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "BOT_CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install chromium
            echo "BOT_CHROMIUM_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
          fi
      - name: Build candidate SPA
        run: npm run build --prefix web
      - name: Check pickup settings, outages and notification delivery
        timeout-minutes: 5
        run: BOT_OUT=pr-preview/pickup-reminder node scripts/pickup-reminder-check.mjs
      - name: Bound retained browser evidence
        id: evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('pr-preview/pickup-reminder')
          files = list(root.rglob('*')) if root.exists() else []
          regular = [p for p in files if p.is_file()]
          assert not any(p.is_symlink() for p in files), 'Unexpected evidence symlink'
          assert len(regular) <= 256, 'Evidence file cap exceeded'
          sizes = [p.stat().st_size for p in regular]
          assert all(n <= 8 * 1024 * 1024 for n in sizes), 'Evidence file extent exceeded'
          assert sum(sizes) <= 64 * 1024 * 1024, 'Evidence aggregate cap exceeded'
          print(json.dumps({'files': len(regular), 'bytes': sum(sizes), 'capBytes': 64 * 1024 * 1024}))
          PY
      - name: Retain reminder report and screenshots
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pickup-reminder-review
          path: services/shuttle-v2/pr-preview/pickup-reminder/
          if-no-files-found: warn
          retention-days: 7
