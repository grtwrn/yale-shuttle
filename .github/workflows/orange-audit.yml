name: orange-data-integrity-audit
on:
  push:
    branches: [research/all-k10-2026-09-21]
    paths: ['research/orange-audit/**', '.github/workflows/orange-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/shuttle-v2
      - uses: actions/download-artifact@v4
        with:
          name: k-sweep-results
          run-id: 35675832882
          github-token: ${{ github.token }}
          path: research/k-sweep/results
      - name: Reconstruct Orange stop events
        env:
          TZ: America/New_York
        run: services/shuttle-v2/node_modules/.bin/tsx research/orange-audit/replay.ts
      - name: Audit paths and refit without suspect records
        env:
          BLUE_MAX_PATH_SECONDS: '5400'
        run: python3 research/orange-audit/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orange-integrity-results
          path: research/k-sweep/results/orange-audit
          retention-days: 90
