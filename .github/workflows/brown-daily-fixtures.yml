name: research-brown-daily-fixtures
on:
  push:
    branches: [research/brown-daily-seals-2026-09-22]
    paths: [research/brown-daily-seals/*.py, research/brown-daily-seals/IMPLEMENTATION.json, research/brown-daily-seals/units/**, research/brown-daily-seals/fixtures-data/**, .github/workflows/brown-daily-fixtures.yml, .github/workflows/brown-daily-seal.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: fixed-brown-daily-seals
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/New_York
      BLUE_MAX_PATH_SECONDS: '5400'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix services/shuttle-v2
      - name: Synthetic contracts and child-resource fixtures (no fit)
        run: python3 -m unittest discover -s research/brown-daily-seals -p 'test_*.py' -v
      - name: Prepare synthetic publication transport fixture
        run: python3 research/brown-daily-seals/transport_fixture.py prepare
      - uses: actions/upload-artifact@v4
        id: transport
        with:
          name: synthetic-brown-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/brown-daily-seals/work/transport-original/**
          retention-days: 90
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.transport.outputs.artifact-id }}
          merge-multiple: true
          path: research/brown-daily-seals/work/transport-published
      - name: Verify actual synthetic artifact bytes, API identity and publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.transport.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.transport.outputs.artifact-digest }}
        run: python3 research/brown-daily-seals/transport_fixture.py verify
      - name: Validate inactive calendar expressions on hosted runner
        run: |
          systemd-analyze calendar '2026-09-23..29 04,06,10:10:00 America/New_York'
          systemd-analyze calendar '2026-09-23..29 17:10:00 America/New_York'
      - uses: actions/download-artifact@v4
        with:
          name: canonical-window-results
          run-id: 35684356219
          github-token: ${{ github.token }}
          path: research/brown-rolling-seal/input/canonical
      - uses: actions/download-artifact@v4
        with:
          name: k-sweep-results
          run-id: 35677536788
          github-token: ${{ github.token }}
          path: research/k-sweep/results
      - uses: actions/download-artifact@v4
        with:
          name: rolling-brown-seal-diagnostics
          run-id: 35696391115
          github-token: ${{ github.token }}
          path: research/brown-daily-seals/work/sep23-reference
      - name: Opened Sep21 normalization and full reducer prefix gates only
        run: python3 research/brown-daily-seals/run_daily.py --normalization-fixture
      - name: Verify original scripts and production tree unchanged
        if: always()
        run: git diff --exit-code 6546241 -- services/shuttle-v2 research/brown-rolling-seal research/brown-model-seal research/brown-directed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brown-daily-fixture-results
          path: |
            research/brown-daily-seals/results/**
            research/brown-rolling-seal/replay-results/parity-summary.json
            research/brown-rolling-seal/input/raw-audit.json
          retention-days: 90
