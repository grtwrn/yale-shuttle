name: checkpoint-residual-development
on:
  push:
    branches: [research/checkpoint-residual-2026-09-22]
    paths: ['research/checkpoint-residual/**', '.github/workflows/checkpoint-residual.yml']
  workflow_dispatch:
    inputs:
      fixtures_only:
        description: Run only synthetic causal/support fixtures
        type: boolean
        default: true
      support_run:
        description: Reduce an existing Stage A artifact only; no replay or model fitting
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s research/checkpoint-residual -p 'test_*.py' -v
      - run: npm ci --prefix services/shuttle-v2
      - name: Original strict-source, raw-occurrence and new fold/projection fixtures
        run: |
          services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-ensemble/membership.test.ts
          services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-ensemble/progress.test.ts
          services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-residual/folds.test.ts
  support-ledger:
    needs: fixtures
    if: github.event_name == 'workflow_dispatch' && inputs.fixtures_only == false && inputs.support_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: America/New_York
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/shuttle-v2
      - uses: actions/download-artifact@v4
        with:
          name: k-sweep-results
          run-id: 35677536788
          github-token: ${{ github.token }}
          path: research/k-sweep/results
      - uses: actions/download-artifact@v4
        with:
          name: canonical-window-results
          run-id: 35684356219
          github-token: ${{ github.token }}
          path: research/highway-frozen
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-ensemble-features
          run-id: 35740424751
          github-token: ${{ github.token }}
          path: research/checkpoint-residual/reference
      - name: Preserve immutable source metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ln -s "$GITHUB_WORKSPACE/research/highway-frozen/canonical-windows/results" research/canonical-windows/results
          gh api repos/grtwrn/yale-shuttle/actions/artifacts/10699234338 > research/checkpoint-residual/reference/artifact-metadata.json
      - name: Causal fold waits, universal source projection controls and deleted-future parity
        run: services/shuttle-v2/node_modules/.bin/tsx research/checkpoint-residual/materialize.ts
      - name: Necessary source-date and distinct-journey ceilings; no fits or outcome scores
        run: python3 research/checkpoint-residual/support.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-residual-support-summary
          path: |
            research/checkpoint-residual/PLAN.md
            research/checkpoint-residual/results/REPORT.md
            research/checkpoint-residual/results/support-summary.json
            research/checkpoint-residual/results/materialization-audit.json
            research/checkpoint-residual/results/folds.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-residual-support-complete
          path: research/checkpoint-residual/results/**
          retention-days: 90
  ceiling-digest:
    needs: fixtures
    if: github.event_name == 'workflow_dispatch' && inputs.fixtures_only == false && inputs.support_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-residual-support-complete
          run-id: ${{ inputs.support_run }}
          github-token: ${{ github.token }}
          path: research/checkpoint-residual/results
      - name: Reduce fixed source-date and journey ceilings; assert original ledger hashes unchanged
        run: python3 research/checkpoint-residual/support_digest.py
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-residual-ceiling-digest
          path: |
            research/checkpoint-residual/results/support-digest.json
            research/checkpoint-residual/results/DIGEST.md
          retention-days: 90
