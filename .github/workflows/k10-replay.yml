name: k10-clock-replay
on:
  pull_request:
    branches: [master]
    paths: ['services/shuttle-v2/**', '.github/workflows/k10-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    # One-off qualification of this trial. The archived reference artifact has
    # finite retention and must not become a permanent dependency of other PRs.
    if: github.head_ref == 'feat/k10-live-trial-2026-09-21' || github.head_ref == 'feat/k10-history-warmup-2026-09-21' || github.head_ref == 'feat/blue-k10-default-2026-09-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9739210736d06e42db42485d9c91fc38a7a5e6f7
          path: research-source
          sparse-checkout: research/earlier-checkpoint/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/shuttle-v2
      - uses: actions/download-artifact@v4
        with:
          name: earlier-checkpoint-results
          run-id: 35642308886
          github-token: ${{ github.token }}
          path: frozen-results
      - name: Replay the actual live clock against the causal research reference
        env:
          TZ: America/New_York
        run: services/shuttle-v2/node_modules/.bin/tsx services/shuttle-v2/scripts/k10-clock-replay.ts research-source/research/earlier-checkpoint/data frozen-results
      - name: Recover restart clocks from preceding GPS only
        if: github.head_ref == 'feat/k10-history-warmup-2026-09-21' || github.head_ref == 'feat/blue-k10-default-2026-09-21'
        env:
          TZ: America/New_York
        run: services/shuttle-v2/node_modules/.bin/tsx services/shuttle-v2/scripts/k10-warmup-replay.ts research-source/research/earlier-checkpoint/data frozen-results
