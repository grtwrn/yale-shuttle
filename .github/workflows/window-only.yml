name: window-only-experiments
on:
  push:
    branches: [research/window-only-2026-09-21]
    paths: ['research/window-only/**', '.github/workflows/window-only.yml']
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix services/shuttle-v2
      - uses: actions/download-artifact@v4
        with:
          name: canonical-window-results
          run-id: 35684356219
          github-token: ${{ github.token }}
          path: research/window-only/input
      - uses: actions/download-artifact@v4
        with:
          name: k-sweep-results
          run-id: 35677536788
          github-token: ${{ github.token }}
          path: research/k-sweep/results
      - name: Check fixed transformation boundaries
        run: |
          python3 -m unittest discover -s research/window-only -p 'test_*.py' -v
          python3 research/useful-windows/rider_risk.py --self-test
      - name: Persist hybrid predictions then join unchanged canonical labels
        env:
          BLUE_MAX_PATH_SECONDS: '5400'
        run: python3 research/window-only/study.py
      - name: Replay actions and verify point and display parity
        run: |
          ln -s ../../k-sweep/results/raw_positions.jsonl.gz research/window-only/results/raw_positions.jsonl.gz
          python3 research/useful-windows/rider_risk.py research/window-only/results
          python3 research/window-only/action_audit.py
          services/shuttle-v2/node_modules/.bin/tsx research/useful-windows/rendered-parity.ts research/window-only/results/rider-risk
          sha256sum --check research/window-only/results/immutable-inputs.sha256
          python3 research/window-only/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-only-results
          path: |
            research/window-only/results/**
            !research/window-only/results/raw_positions.jsonl.gz
          retention-days: 90
